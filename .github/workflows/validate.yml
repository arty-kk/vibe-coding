name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        python: ['3.10', '3.13']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r plugins/vibe-coding/requirements.txt -r site/requirements.txt
      - run: python plugins/vibe-coding/scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python plugins/vibe-coding/scripts/catalog.py refresh
      - run: python scripts/build_site.py
      - run: git diff --exit-code
  runtime-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python review/run_runtime_checks.py
      - run: node --test tests/test_site_search.cjs
  claude-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/claude-validator" --no-audit --no-fund @anthropic-ai/claude-code@2.1.278
      - name: Validate Claude manifests
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-state
        run: |
          "$RUNNER_TEMP/claude-validator/node_modules/.bin/claude" plugin validate .claude-plugin/marketplace.json --strict
          "$RUNNER_TEMP/claude-validator/node_modules/.bin/claude" plugin validate .claude-plugin/plugin.json --strict
          "$RUNNER_TEMP/claude-validator/node_modules/.bin/claude" plugin validate plugins/vibe-coding --strict
