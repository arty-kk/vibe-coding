name: Validate OpenAI distribution

on:
  push:
    branches: [main]
    paths:
      - 'plugins/vibe-coding/**'
      - 'scripts/package_openai.py'
      - 'tests/test_openai_distribution.py'
      - 'CHANGELOG.md'
      - '.github/workflows/openai-distribution.yml'
  pull_request:
    paths:
      - 'plugins/vibe-coding/**'
      - 'scripts/package_openai.py'
      - 'tests/test_openai_distribution.py'
      - 'CHANGELOG.md'
      - '.github/workflows/openai-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","a3d-linux-x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r plugins/vibe-coding/requirements.txt
      - run: python -m unittest discover -s tests -p test_openai_distribution.py -v
      - name: Build distribution in a unique job directory
        run: |
          package_directory=$(mktemp -d "$RUNNER_TEMP/vibe-openai.XXXXXX")
          python scripts/package_openai.py --output "$package_directory/vibe-coding-openai.zip"
