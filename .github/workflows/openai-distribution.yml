name: Validate OpenAI distribution

on:
  push:
    branches: [main]
    paths:
      - 'plugins/vibe-coding/**'
      - 'scripts/package_openai.py'
      - 'tests/test_openai_distribution.py'
      - 'CHANGELOG.md'
      - '.github/workflows/openai-distribution.yml'
  pull_request:
    paths:
      - 'plugins/vibe-coding/**'
      - 'scripts/package_openai.py'
      - 'tests/test_openai_distribution.py'
      - 'CHANGELOG.md'
      - '.github/workflows/openai-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r plugins/vibe-coding/requirements.txt
      - run: python -m unittest discover -s tests -p test_openai_distribution.py -v
      - run: python scripts/package_openai.py --output /tmp/vibe-coding-openai.zip
