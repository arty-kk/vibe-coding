name: Validate MCP library
on:
  workflow_dispatch:
  push:
    paths: ['mcp/**', 'plugins/**', 'site/catalog-engine.js', 'scripts/package_openai*.py', 'tests/test_mcp_distribution.py', '.github/workflows/mcp-library.yml']
  pull_request:
    paths: ['mcp/**', 'plugins/**', 'site/catalog-engine.js', 'scripts/package_openai*.py', 'tests/test_mcp_distribution.py', '.github/workflows/mcp-library.yml']
permissions:
  contents: read
jobs:
  mcp:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","a3d-linux-x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci --prefix mcp --ignore-scripts --no-audit --no-fund
      - run: python mcp/generate.py
      - run: npm test --prefix mcp
      - run: node mcp/run-review.js
